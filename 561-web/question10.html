	<body>
		<div id = "mainDiv">
			<h1>Calculator</h1>
			<div id = "calcDiv">
				<div id = "dispWin">
					<p id = resBox>Results here</p>
				</div>
				<div id = "btnWin">
					<div id = "numBtn">
						<button id = "num1" class = "numBtn" onclick = numPrs() >1</button>
						<button id = "num2" class = "numBtn"  onclick = numPrs() >2</button>
						<button id = "num3" class = "numBtn"  onclick = numPrs() >3</button>
