	<body onload = "dateDisplay()">
		<div id="mainDiv">
			<div id = "header">
				<h1>Date and stuff</h1>
			</div>
			<div id = "content">
			
				<div id = "dateShowDiv">
					<label for = "dateNorm"> Date and Time Today in Normal Format : </label>
					<p id = "dateNorm"></p>
					<label for = "dateUTC"> Date and Time Today in UTC Format : </label>
					<p id = "dateUTC"></p>
					<label for = "dateISO"> Date and Time Today in ISO Format : </label>
					<p id = "dateISO"></p>
				</div>
				
				<div id = "datePickerDiv">
					<label for = "datePick">Select Date :</label>
					<input type = "date" id = "datePick">
					<p id = "daysElap"></p>
					<p id = "timeElap"></p>
					
					<button onclick = "findTimeElap()">Find Time Elapsed</button>
				</div>
				
			</div>
		</div>
